<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lector - MangaWave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/reader.css">
<link rel="stylesheet" href="css/buttons.css">
</head>
<body data-theme="neonkanji">
<header class="reader-bar">
    <button id="backBtn" class="btn btn-hover-fill btn-sm">
      <span class="btn-label">Volver</span>
      <span class="btn-fly">
        <span>Volver</span>
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="btn-dot"></span>
    </button>
  <h2 id="mangaTitle" class="reader-title"></h2>
  <div class="reader-controls">
    <select id="chapterSelect" class="chapter-select"></select>
    <label class="width-label">Ancho
      <input type="range" id="widthRange" min="30" max="100" value="70">
      <span class="width-value" id="widthValue">70%</span>
    </label>
  </div>
</header>
<main id="pagesWrap" class="pages-wrap"></main>
<script src="js/reader.js"></script>
</body>
</html>
